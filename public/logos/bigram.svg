<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#312e81;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1b4b;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:1" />
    </linearGradient>
    
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Animated wave lines background -->
  <g opacity="0.15" stroke="#60a5fa" stroke-width="2" fill="none">
    <path d="M 0 250 Q 200 230 400 250 T 800 250"/>
    <path d="M 0 300 Q 200 280 400 300 T 800 300"/>
    <path d="M 0 350 Q 200 330 400 350 T 800 350"/>
  </g>
  
  <!-- Title -->
  <g>
    <text x="400" y="75" text-anchor="middle" fill="url(#neonBlue)" font-size="52" font-family="Arial, sans-serif" font-weight="900" filter="url(#neonGlow)">BIGRAM</text>
    <text x="400" y="118" text-anchor="middle" fill="url(#neonCyan)" font-size="28" font-family="Arial, sans-serif" font-weight="300">Language Model</text>
  </g>
  
  <!-- Character flow diagram -->
  <g>
    <!-- Input -->
    <g>
      <rect x="60" y="200" width="150" height="200" rx="10" fill="#1e1b4b" stroke="url(#neonBlue)" stroke-width="3" opacity="0.6"/>
      <text x="135" y="235" text-anchor="middle" fill="#60a5fa" font-size="16" font-family="Arial, sans-serif" font-weight="600">INPUT</text>
      
      <rect x="85" y="255" width="100" height="40" rx="5" fill="#312e81" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="135" y="282" text-anchor="middle" fill="#fff" font-size="32" font-family="monospace" font-weight="bold">S</text>
      
      <rect x="85" y="310" width="100" height="40" rx="5" fill="#312e81" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="135" y="337" text-anchor="middle" fill="#fff" font-size="32" font-family="monospace" font-weight="bold">A</text>
      
      <rect x="85" y="365" width="100" height="40" rx="5" fill="#1e3a8a" stroke="url(#neonBlue)" stroke-width="2"/>
      <text x="135" y="392" text-anchor="middle" fill="url(#neonCyan)" font-size="32" font-family="monospace" font-weight="bold">M</text>
      
      <circle cx="200" cy="385" r="4" fill="#22d3ee" filter="url(#neonGlow)"/>
    </rect>
    </g>
    
    <!-- Neural processing -->
    <g>
      <rect x="270" y="250" width="120" height="100" rx="10" fill="#1e1b4b" stroke="url(#neonCyan)" stroke-width="3" opacity="0.8"/>
      <text x="330" y="280" text-anchor="middle" fill="#22d3ee" font-size="14" font-family="Arial, sans-serif" font-weight="600">NEURAL NET</text>
      
      <!-- Nodes -->
      <circle cx="295" cy="300" r="6" fill="#3b82f6" filter="url(#neonGlow)"/>
      <circle cx="330" cy="295" r="6" fill="#3b82f6" filter="url(#neonGlow)"/>
      <circle cx="365" cy="300" r="6" fill="#3b82f6" filter="url(#neonGlow)"/>
      <circle cx="295" cy="330" r="6" fill="#06b6d4" filter="url(#neonGlow)"/>
      <circle cx="330" cy="335" r="6" fill="#06b6d4" filter="url(#neonGlow)"/>
      <circle cx="365" cy="330" r="6" fill="#06b6d4" filter="url(#neonGlow)"/>
      
      <!-- Connections -->
      <line x1="295" y1="306" x2="330" y2="329" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
      <line x1="330" y1="301" x2="330" y2="329" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
      <line x1="365" y1="306" x2="330" y2="329" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
    </g>
    
    <!-- Output probabilities -->
    <g>
      <rect x="450" y="200" width="290" height="200" rx="10" fill="#1e1b4b" stroke="url(#neonBlue)" stroke-width="3" opacity="0.6"/>
      <text x="595" y="235" text-anchor="middle" fill="#60a5fa" font-size="16" font-family="Arial, sans-serif" font-weight="600">OUTPUT (Next Char)</text>
      
      <!-- Probability bars -->
      <g font-family="monospace" font-size="18">
        <text x="470" y="272" fill="#fff" font-weight="bold">A</text>
        <rect x="500" y="255" width="200" height="20" rx="3" fill="#0f172a"/>
        <rect x="500" y="255" width="160" height="20" rx="3" fill="url(#barGrad)" filter="url(#neonGlow)"/>
        <text x="710" y="272" fill="#22d3ee" font-size="14">0.42</text>
        
        <text x="470" y="307" fill="#fff" font-weight="bold">L</text>
        <rect x="500" y="290" width="200" height="20" rx="3" fill="#0f172a"/>
        <rect x="500" y="290" width="110" height="20" rx="3" fill="url(#barGrad)" opacity="0.7"/>
        <text x="710" y="307" fill="#22d3ee" font-size="14">0.28</text>
        
        <text x="470" y="342" fill="#fff" font-weight="bold">I</text>
        <rect x="500" y="325" width="200" height="20" rx="3" fill="#0f172a"/>
        <rect x="500" y="325" width="70" height="20" rx="3" fill="url(#barGrad)" opacity="0.5"/>
        <text x="710" y="342" fill="#22d3ee" font-size="14">0.18</text>
        
        <text x="470" y="377" fill="#fff">M</text>
        <rect x="500" y="360" width="200" height="20" rx="3" fill="#0f172a"/>
        <rect x="500" y="360" width="40" height="20" rx="3" fill="url(#barGrad)" opacity="0.3"/>
        <text x="710" y="377" fill="#22d3ee" font-size="14">0.12</text>
      </g>
    </g>
    
    <!-- Flow arrows -->
    <g stroke="url(#neonCyan)" stroke-width="3" fill="none" marker-end="url(#arrowNeon)">
      <defs>
        <marker id="arrowNeon" markerWidth="12" markerHeight="12" refX="10" refY="3" orient="auto">
          <polygon points="0 0, 12 3, 0 6" fill="#22d3ee"/>
        </marker>
      </defs>
      <path d="M 215 300 L 265 300" filter="url(#neonGlow)"/>
      <path d="M 395 300 L 445 300" filter="url(#neonGlow)"/>
    </g>
  </g>
  
  <!-- Result display -->
  <g>
    <rect x="250" y="450" width="300" height="80" rx="12" fill="#0f172a" stroke="url(#neonCyan)" stroke-width="2" filter="url(#neonGlow)"/>
    <text x="400" y="480" text-anchor="middle" fill="#60a5fa" font-size="16" font-family="Arial, sans-serif" font-weight="500">Generated Name:</text>
    <text x="400" y="515" text-anchor="middle" fill="url(#neonCyan)" font-size="38" font-family="monospace" font-weight="bold" filter="url(#neonGlow)">SAMA</text>
  </g>
  
  <!-- Tech badge -->
  <g>
    <rect x="325" y="550" width="150" height="30" rx="15" fill="#0f172a" stroke="url(#neonBlue)" stroke-width="2"/>
    <text x="400" y="572" text-anchor="middle" fill="url(#neonBlue)" font-size="14" font-family="Arial, sans-serif" font-weight="600">PyTorch • NLP</text>
  </g>
</svg>